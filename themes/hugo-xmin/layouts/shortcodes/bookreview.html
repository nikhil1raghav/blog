{{ if .InnerDeindent }}
<div class="book-intro">
{{ .InnerDeindent | markdownify }}
</div>
{{ end }}

<table>
  <thead>
    <tr>
      <th>Book Title</th>
      <th>Author</th>
      <th>Review</th>
      <th>Rating</th>
    </tr>
  </thead>
  <tbody>
    {{ range .Page.Params.reviews }}
    <tr>
      {{ $t := .title }}
      <td>{{ with .url }}<a href="{{ . }}" target="_blank">{{ $t }}</a>{{ else }}{{ $t }}{{ end }}</td>
      <td>{{ .author }}</td>
      <td>{{ .review }}</td>
      <td style="white-space: nowrap;">
        {{ range seq (int .rating) }}
        ⭐
        {{ end }}
      </td>
    </tr>
    {{ end }}
  </tbody>
</table>
